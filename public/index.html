<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chrono Todo</title>
  <meta name="description" content="Ta todo avec chronomètre par tâche, projets et sous-projets.">
  <meta name="theme-color" content="#f4f4f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0e13" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Chrono Todo">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-tab="today" data-screen="profiles">
  <section id="profiles" hidden></section>

  <header class="top">
    <div class="topbar">
      <h1 id="title">Tâches</h1>
      <button class="sync-dot" id="sync" type="button" data-action="sync-badge" aria-label="Synchronisation"></button>
      <button class="who-pill" id="who" type="button" data-action="switch-profile" aria-label="Changer de profil"></button>
      <button class="icon-btn" type="button" data-action="open-settings" aria-label="Réglages">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.9" class="fill"/><circle cx="12" cy="12" r="1.9" class="fill"/><circle cx="19" cy="12" r="1.9" class="fill"/></svg>
      </button>
    </div>
    <div id="banner" hidden></div>
  </header>

  <main id="view" class="wrap"></main>

  <!-- Quatre onglets, « + » au centre (créer une tâche depuis partout) -->
  <nav class="tabbar" aria-label="Navigation">
    <button type="button" data-action="tab" data-value="today">
      <span class="tb-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg><i class="tb-badge" hidden></i></span>
      <span class="tb-lab">Aujourd’hui</span>
    </button>
    <button type="button" data-action="tab" data-value="tasks">
      <span class="tb-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5"/></svg><i class="tb-badge dot" hidden></i></span>
      <span class="tb-lab">Tâches</span>
    </button>
    <button type="button" class="tb-add" data-action="new-task" aria-label="Nouvelle tâche" title="Nouvelle tâche (N)">
      <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
    </button>
    <button type="button" data-action="tab" data-value="plan">
      <span class="tb-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>
      <span class="tb-lab">Planning</span>
    </button>
    <button type="button" data-action="tab" data-value="review">
      <span class="tb-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 20h15"/><path d="M7 16.5v-4M11.5 16.5v-7M16 16.5V13"/><path d="M14.2 6.6l1.9 1.9 3.6-3.6"/></svg></span>
      <span class="tb-lab">Bilan</span>
    </button>
  </nav>

  <dialog id="sheet" class="sheet"></dialog>
  <dialog id="ask" class="ask"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js" defer></script>
</body>
</html>
